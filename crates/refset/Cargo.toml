[package]
name = "bloomery-refset"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
name = "refset"

[[bin]]
name = "refset-check"
path = "src/bin/refset_check.rs"

[lints]
workspace = true

[dependencies]
bloomery-gguf = { path = "../gguf" }
# The `# fixture` line of a checkpoint folder's first shard reads its safetensors header's `__metadata__`.
serde_json = "=1.0.151"
thiserror = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
